name: Android CI

on:
  push:
    branches: [ "master", "feat/hevc-mediacodec" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            nasm yasm cmake ninja-build build-essential \
            autogen autopoint gettext curl git

      - name: Set up Android NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Export Android paths
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FFmpeg (arm64-v8a, with MediaCodec encoder)
        run: |
          ./scripts/setup_environ.sh
          ./scripts/build_libs.sh

      - name: Show built FFmpeg encoders (sanity check)
        run: |
          echo "=== libraries.jar contents ==="
          unzip -l app/libs/libraries.jar || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FFmpegPlugin-mediacodec-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload FFmpeg build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-log
          path: ffmpeg-kit/build.log
          if-no-files-found: ignore
